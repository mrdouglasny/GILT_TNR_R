# Default (production) config for Ising eigensystem
# Run time: ~30 minutes

chi = 30
gilt_eps = 6e-6
cg_eps = 1e-10
rotate = false

relT = 1.0000110043  # Critical temperature (from chi=30 search)
Jratio = 1.0

number_of_initial_steps = 23
N = 10  # Number of eigenvalues
krylovdim = 30
verbosity = 1

ord = 2  # Finite difference order
stp = 1e-4  # Finite difference step

Z2_odd_sector = true
freeze_R = false
