# Default (production) config for phi4 eigensystem
# Run time: ~30 minutes

chi = 30
gilt_eps = 6e-6
cg_eps = 1e-10
rotate = false

# Phi4 model parameters
lam = 1.0
kappa = 0.3  # Use 0.3 for good phase separation (not 1.0!)
mu_sq = -1.2  # Critical point for kappa=0.3, lambda=1 (refined)
K = 32  # Quadrature points
D = 16  # Initial bond dimension

number_of_initial_steps = 10
N = 10  # Number of eigenvalues
krylovdim = 25
verbosity = 1

ord = 2  # Finite difference order
stp = 1e-4  # Finite difference step
